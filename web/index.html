<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="JCPL-4 - Jade Cricket Premier League">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#05031A">

  <meta http-equiv="Cache-Control" content="no-cache">

  <!-- Google Sign-In Client ID -->
  <meta name="google-signin-client_id" content="318152754285-sjail15869rot66dgan9qbpogke709is.apps.googleusercontent.com">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="JCPL-4">

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&display=swap">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>JCPL-4</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #05031A;
      overflow: hidden;
    }
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 35%, #2E1A7A 0%, #05031A 70%);
      transition: opacity 600ms ease;
      font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    }
    #app-loader.hide { opacity: 0; pointer-events: none; }
    #app-loader .title {
      color: #fff;
      font-weight: 900;
      font-size: clamp(72px, 24vw, 140px);
      letter-spacing: 8px;
      line-height: 0.9;
      text-shadow: 0 0 24px rgba(236, 72, 153, 0.6), 0 0 56px rgba(124, 58, 237, 0.6);
      animation: jcpl-pulse 1.6s ease-in-out infinite;
    }
    #app-loader .bar {
      margin-top: 28px;
      width: 120px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
      overflow: hidden;
    }
    #app-loader .bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #2563EB, #7C3AED, #EC4899);
      animation: jcpl-slide 1.2s ease-in-out infinite;
    }
    @keyframes jcpl-pulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes jcpl-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div id="app-loader">
    <div class="title">JCPL</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('app-loader');
      if (!loader) return;
      loader.classList.add('hide');
      setTimeout(function () { loader.remove(); }, 700);
    });

    (function boot() {
      var script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=' + {{flutter_service_worker_version}};
      script.async = true;
      document.body.appendChild(script);

      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (r) { r.unregister(); });
          });
        }
        if (window.caches) {
          caches.keys().then(function (keys) {
            keys.forEach(function (k) { caches.delete(k); });
          });
        }
      } catch (e) {
        console.warn('Could not clear old web cache', e);
      }
    })();
  </script>
</body>
</html>
